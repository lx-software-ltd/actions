name: Dependency submission
description: >-
  Submit pinned Python requirements and npm lockfiles. Check workflow
  uses without submitting them.

inputs:
  root:
    description: Directory to scan when manifests is empty.
    required: false
    default: ""
  manifests:
    description: Newline-separated manifest paths relative to root. Empty scans the tree.
    required: false
    default: ""
  ignore:
    description: >-
      Newline-separated paths, relative to root, left out of the snapshot.
      A path that matches nothing fails the run.
    required: false
    default: ""
  submit:
    description: Post the snapshot when true. Any other value only writes it.
    required: false
    default: "false"
  token:
    description: Token with contents write. Required when submit is true.
    required: false
    default: ""
  snapshot-path:
    description: Where to write the snapshot JSON. Empty skips the file.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build dependency snapshot
      shell: bash
      env:
        DEPENDENCY_SUBMISSION_ROOT: ${{ inputs.root }}
        DEPENDENCY_SUBMISSION_MANIFESTS: ${{ inputs.manifests }}
        DEPENDENCY_SUBMISSION_IGNORE: ${{ inputs.ignore }}
        DEPENDENCY_SUBMISSION_SUBMIT: ${{ inputs.submit }}
        DEPENDENCY_SUBMISSION_TOKEN: ${{ inputs.token }}
        DEPENDENCY_SUBMISSION_SNAPSHOT: ${{ inputs.snapshot-path }}
      run: python3 "$GITHUB_ACTION_PATH/snapshot.py"
