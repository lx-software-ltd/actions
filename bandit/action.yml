name: Bandit
description: Run Bandit on the caller's paths. A finding fails the step.

inputs:
  paths:
    description: Space-separated paths passed to bandit -r.
    required: true
    default: ""
  skip:
    description: Comma-separated Bandit test ids to skip.
    required: false
    default: ""
  root:
    description: Directory to run in. Empty uses the workspace.
    required: false
    default: ""
  exclude:
    description: >-
      Glob paths passed to bandit --exclude, comma-separated. Use it for
      tests that sit next to the scanned code. Empty excludes nothing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run Bandit
      shell: bash
      env:
        BANDIT_PATHS: ${{ inputs.paths }}
        BANDIT_SKIP: ${{ inputs.skip }}
        BANDIT_ROOT: ${{ inputs.root }}
        BANDIT_EXCLUDE: ${{ inputs.exclude }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
