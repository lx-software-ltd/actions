name: Setup Python
description: >-
  Set up Python. When a requirements file is passed, cache pip against
  it. The default version is 3.12. Callers pass the version they use
  today until their own convergence pull request.

inputs:
  python-version:
    description: Python version passed to actions/setup-python. Default 3.12.
    required: false
    default: "3.12"
  requirements:
    description: >-
      Requirements file for the pip cache, relative to the workspace.
      Leave empty to set up Python without a cache.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python with the pip cache
      if: inputs.requirements != ''
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements }}

    - name: Set up Python
      if: inputs.requirements == ''
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
