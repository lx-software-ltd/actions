name: Security Scanning

# security-summary aggregates this workflow. main-protection requires
# lint, test, and security-summary.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pii-denylist:
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: ./pii-denylist

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # MIT-licensed gitleaks CLI. The gitleaks action needs a licence on
      # organisation repositories, and Dependabot pull requests cannot read it.
      - name: Run Gitleaks
        uses: ./gitleaks

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            queries: security-extended
          - language: actions
            queries: security-extended
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Analyze with CodeQL
        uses: ./codeql
        with:
          language: ${{ matrix.language }}
          queries: ${{ matrix.queries }}
          category: /language:${{ matrix.language }}

  security-summary:
    name: security-summary
    runs-on: ubuntu-26.04
    needs:
      - pii-denylist
      - secrets-scan
      - codeql
    if: always()
    steps:
      # Pinned to the merge on main. See the matching comment in lint.yml.
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
