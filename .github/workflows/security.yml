name: Security Scanning

# The security-summary job aggregates this workflow. It is not a required
# check, and no ruleset is attached, so a red result here does not block a
# merge. PII and Gitleaks also run inside lint.yml so the lint check fails
# when they fail, once the owner requires that check.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  pii-denylist:
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        run: python3 scripts/check_pii.py

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # MIT-licensed gitleaks CLI. The gitleaks action needs a licence on
      # organisation repositories, and Dependabot pull requests cannot read it.
      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          downloaded=0
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $(((attempt - 1) * 2))
            fi
            if curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tgz; then
              downloaded=1
              break
            fi
          done
          test "$downloaded" = 1
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --no-banner

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            queries: security-extended
          - language: actions
            queries: security-extended
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: false

  security-summary:
    name: security-summary
    runs-on: ubuntu-26.04
    needs:
      - pii-denylist
      - secrets-scan
      - codeql
    if: always()
    steps:
      # Inline on purpose. This gate does not load an action from the pull request.
      - name: Require every security job
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          if not isinstance(needs, dict) or not needs:
              print("needs must be a non-empty object", file=sys.stderr)
              sys.exit(1)
          failed = []
          for name, value in needs.items():
              result = value.get("result") if isinstance(value, dict) else value
              if result != "success":
                  failed.append(f"{name}={result}")
          if failed:
              print("Jobs did not all succeed: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY
