name: Lint

# main-protection applies. The check named lint is required on main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python3 -m compileall -q -f require-jobs scripts tests

      - name: Check action layout
        run: python3 scripts/check_action_layout.py

      # These scans also run in security.yml. They sit on this job so the
      # lint check fails when they fail. The denylist has no digests, so
      # the PII step checks nothing until the owner adds hashes.
      - name: Check hashed PII denylist
        run: python3 scripts/check_pii.py

      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          downloaded=0
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $(((attempt - 1) * 2))
            fi
            if curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tgz; then
              downloaded=1
              break
            fi
          done
          test "$downloaded" = 1
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --no-banner

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - lint-python
    if: always()
    steps:
      # Pinned to the merge on main. uses: ./require-jobs would load the
      # pull request's copy, and a change that always exits 0 would turn
      # this check green.
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
