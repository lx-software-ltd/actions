name: Lint

# main-protection applies. The check named lint is required on main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python3 -m compileall -q -f require-jobs pii-denylist lib gitleaks python-requirements-pins agent-harness workflow-conformance aws-oidc cdk-bootstrap-check cdk-diff cfn-stack-outputs s3-cloudfront-deploy amplify-release ios-export-options appstore-api-key scripts tests

      - name: Check action layout
        run: python3 scripts/check_action_layout.py

      # These scans also run in security.yml. They sit on this job so the
      # lint check fails when they fail. The denylist has no digests, so
      # the PII step checks nothing until the owner adds hashes.
      - name: Check hashed PII denylist
        uses: ./pii-denylist

      - name: Run Gitleaks
        uses: ./gitleaks

  workflow-conformance:
    name: Workflow conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the CI contract
        uses: ./workflow-conformance
        with:
          mode: enforce
          profile: producer

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - lint-python
      - workflow-conformance
    if: always()
    steps:
      # Pinned to the merge on main. uses: ./require-jobs would load the
      # pull request's copy, and a change that always exits 0 would turn
      # this check green.
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
