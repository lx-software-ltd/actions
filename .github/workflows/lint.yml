name: Lint

# main-protection requires the check named lint.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python3 -m compileall -q -f .

      - name: Check action layout
        run: python3 scripts/check_action_layout.py

      - name: Run Ruff
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.17.6
          ruff check .

      - name: Install shellcheck
        run: |
          version=0.11.0
          curl -fsSL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Run shellcheck
        run: |
          mapfile -t scripts < <(find . -type f -not -path './.git/*' -exec grep -IlZ '^#!.*sh' {} + | tr '\0' '\n')
          shellcheck "${scripts[@]}"

      - name: Install actionlint
        run: |
          version=1.7.12
          curl -fsSL -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Run actionlint
        run: actionlint

  workflow-conformance:
    name: Workflow conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the CI contract
        uses: ./workflow-conformance
        with:
          profile: producer

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - lint-python
      - workflow-conformance
    if: always()
    steps:
      # Pinned to the merge on main. uses: ./require-jobs would load the
      # pull request's copy, and a change that always exits 0 would turn
      # this check green.
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
