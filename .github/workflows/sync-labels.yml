name: Sync labels

# Applies the shared catalogue to this repository. github.token can write
# labels here. The five-repository run is
# SYNC_LABELS_REPOSITORIES=siblings, and that token has to be able to
# write issues on each product repository.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply the shared catalogue
        uses: ./sync-labels
        with:
          token: ${{ github.token }}
          mode: apply
          repositories: ${{ github.repository }}
