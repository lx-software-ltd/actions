name: Test

# main-protection applies. The check named test is required on main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  require-jobs-pass:
    name: Require jobs pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load passing fixture
        id: pass
        run: |
          {
            echo "needs-json<<EOF"
            cat fixtures/require-jobs/pass/needs.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require jobs
        uses: ./require-jobs
        with:
          needs-json: ${{ steps.pass.outputs.needs-json }}

  require-jobs-fail:
    name: Require jobs fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load failing fixture
        id: fail
        run: |
          {
            echo "needs-json<<EOF"
            cat fixtures/require-jobs/fail/needs.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require jobs
        id: require
        continue-on-error: true
        uses: ./require-jobs
        with:
          needs-json: ${{ steps.fail.outputs.needs-json }}

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.require.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-node-fixture:
    name: Setup Node fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No working-directory and no cache. This is the call site that only
      # sets up Node. Default node-version is 26.
      - name: Set up Node with no cache and no project
        uses: ./setup-node

      - name: The default Node major is 26
        shell: bash
        run: node --version | grep -E '^v26\.'

      - name: Cache npm and install the fixture
        uses: ./setup-node
        with:
          cache: npm
          working-directory: fixtures/setup-node

  setup-node-fail:
    name: Setup Node fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache a directory that has no lockfile
        id: setup
        continue-on-error: true
        uses: ./setup-node
        with:
          cache: npm
          working-directory: fixtures/setup-node-no-lock
          install: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-node-unknown-cache:
    name: Setup Node unknown cache
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pass a cache value the action does not support
        id: setup
        continue-on-error: true
        uses: ./setup-node
        with:
          cache: yarn

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-python-fixture:
    name: Setup Python fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Empty requirements sets up Python with no pip cache.
      - name: Set up Python with no cache
        uses: ./setup-python

      - name: The default Python is 3.12
        shell: bash
        run: python --version | grep -E 'Python 3\.12\.'

      - name: Set up Python and cache pip
        uses: ./setup-python
        with:
          requirements: fixtures/setup-python/requirements.txt

  setup-python-fail:
    name: Setup Python fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache a requirements file that is not there
        id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          requirements: fixtures/setup-python/does-not-exist.txt

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = "failure"

  verify-rulesets-pass:
    name: Verify rulesets pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the passing ruleset
        id: pass
        run: |
          {
            echo "rulesets-json<<EOF"
            cat fixtures/verify-rulesets/pass.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify rulesets
        uses: ./verify-rulesets
        with:
          rulesets-json: ${{ steps.pass.outputs.rulesets-json }}

  verify-rulesets-fail:
    name: Verify rulesets fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the failing ruleset
        id: fail
        run: |
          {
            echo "rulesets-json<<EOF"
            cat fixtures/verify-rulesets/fail.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify rulesets
        id: verify
        continue-on-error: true
        uses: ./verify-rulesets
        with:
          rulesets-json: ${{ steps.fail.outputs.rulesets-json }}

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.verify.outcome }}
        run: test "$OUTCOME" = "failure"

  pii-denylist-pass:
    name: PII denylist pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree that does not match the denylist
        uses: ./pii-denylist
        with:
          denylist-path: denylist.sha256
          root: fixtures/pii-denylist/pass

  pii-denylist-fail:
    name: PII denylist fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree that matches the denylist
        id: scan
        continue-on-error: true
        uses: ./pii-denylist
        with:
          denylist-path: denylist.sha256
          root: fixtures/pii-denylist/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  gitleaks-pass:
    name: Gitleaks pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree with no secret
        uses: ./gitleaks
        with:
          source: fixtures/gitleaks/pass

  gitleaks-fail:
    name: Gitleaks fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create a throwaway repository with one leak
        run: |
          root="$RUNNER_TEMP/gitleaks-fail"
          mkdir -p "$root"
          git -C "$root" init
          prefix=ghp_
          body=A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8
          printf 'token=%s%s\n' "$prefix" "$body" > "$root/secret.txt"
          git -C "$root" add secret.txt
          git -C "$root" -c user.email=fixture@example.com -c user.name=fixture commit -m fixture

      - name: Scan a tree with an access key
        id: scan
        continue-on-error: true
        uses: ./gitleaks
        with:
          source: ${{ runner.temp }}/gitleaks-fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  checkov-skip:
    name: Checkov missing directory
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip a directory that is not there
        uses: ./checkov-cloudformation
        with:
          directory: fixtures/checkov/missing
          skip-if-missing: "true"

  checkov-fail:
    name: Checkov fail fixture
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a public bucket
        id: scan
        continue-on-error: true
        uses: ./checkov-cloudformation
        with:
          directory: fixtures/checkov/fail
          upload: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

      - name: Expect the workspace SARIF to contain a finding
        shell: bash
        run: |
          python3 - << 'PY'
          import json
          import sys
          from pathlib import Path

          def load(path: Path) -> dict:
              if path.is_dir():
                  files = sorted(path.glob("*.sarif"))
                  if not files:
                      sys.exit(f"{path} has no SARIF")
                  path = files[0]
              if not path.is_file():
                  sys.exit(f"{path} is missing")
              return json.loads(path.read_text(encoding="utf-8"))

          def count(payload: dict) -> int:
              return sum(len(run.get("results") or []) for run in payload.get("runs") or [])

          raw = count(load(Path("checkov-results.sarif")))
          filtered = count(load(Path("checkov-results.filtered.sarif")))
          if raw < 1 or filtered < 1:
              sys.exit(f"raw={raw} filtered={filtered}")
          PY

  codeql-fail:
    name: CodeQL fail fixture
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject a missing language
        id: scan
        continue-on-error: true
        uses: ./codeql
        with:
          language: ""

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  semgrep-lib-path:
    name: Semgrep shared library path
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 # 2026-11-17
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a clean tree inside the Semgrep container
        uses: ./semgrep
        with:
          rules: fixtures/semgrep/rule.yml
          source: fixtures/semgrep/pass

  semgrep-fail:
    name: Semgrep fail fixture
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 # 2026-11-17
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree the fixture rule matches
        id: scan
        continue-on-error: true
        uses: ./semgrep
        with:
          rules: fixtures/semgrep/rule.yml
          source: fixtures/semgrep/fail
          upload: "false"

      - name: Expect findings and a resolved library path
        shell: sh
        run: |
          test -f semgrep-results.sarif
          python3 -c 'import json,sys; payload=json.load(open("semgrep-results.sarif")); count=sum(len(run.get("results") or []) for run in payload.get("runs") or []); sys.exit(0 if count == 1 else 1)'

  node-lockfiles-pass:
    name: Node lockfile pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          install: "false"

      - name: Check a lockfile that matches
        uses: ./node-lockfiles
        with:
          directories: fixtures/node-lockfiles/pass

  node-lockfiles-fail:
    name: Node lockfile fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          install: "false"

      - name: Check a directory with no lockfile
        id: scan
        continue-on-error: true
        uses: ./node-lockfiles
        with:
          directories: fixtures/node-lockfiles/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  python-requirements-pass:
    name: Python pins pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pinned requirements
        uses: ./python-requirements-pins
        with:
          files: fixtures/python-requirements/pass/requirements.txt

  python-requirements-fail:
    name: Python pins fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check an unpinned requirement
        id: scan
        continue-on-error: true
        uses: ./python-requirements-pins
        with:
          files: fixtures/python-requirements/fail/requirements.txt

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  flutter-lockfiles-pass:
    name: Flutter lockfile pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip a directory with no pubspec
        uses: ./flutter-lockfiles
        with:
          working-directory: fixtures/flutter-lockfiles/pass
          flutter-version: "3.47.9"
          setup: "false"

  flutter-lockfiles-fail:
    name: Flutter lockfile fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub flutter so the lockfile changes
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/flutter" << 'EOF'
          #!/bin/sh
          printf 'rewritten\n' > pubspec.lock
          EOF
          chmod +x "$RUNNER_TEMP/bin/flutter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check a lockfile the stub rewrites
        id: scan
        continue-on-error: true
        uses: ./flutter-lockfiles
        with:
          working-directory: fixtures/flutter-lockfiles/fail
          flutter-version: "3.47.9"
          setup: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  flutter-version-fail:
    name: Flutter version fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject an empty Flutter version
        id: scan
        continue-on-error: true
        uses: ./flutter-lockfiles
        with:
          working-directory: fixtures/flutter-lockfiles/pass
          flutter-version: ""
          setup: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  pod-lockfiles-pass:
    name: Pod lockfile pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip a directory with no Podfile
        uses: ./pod-lockfiles
        with:
          working-directory: fixtures/pod-lockfiles/pass
          setup: "false"

  pod-lockfiles-fail:
    name: Pod lockfile fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub pod so the lockfile changes
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/pod" << 'EOF'
          #!/bin/sh
          printf 'rewritten\n' > Podfile.lock
          EOF
          chmod +x "$RUNNER_TEMP/bin/pod"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check a lockfile the stub rewrites
        id: scan
        continue-on-error: true
        uses: ./pod-lockfiles
        with:
          working-directory: fixtures/pod-lockfiles/fail
          setup: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  agent-harness-pass:
    name: Agent harness pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check a fixture that satisfies its config
        uses: ./agent-harness
        with:
          root: fixtures/agent-harness/pass

  agent-harness-fail:
    name: Agent harness fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check a rule bullet with no why tag
        id: scan
        continue-on-error: true
        uses: ./agent-harness
        with:
          root: fixtures/agent-harness/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  semgrep-ci:
    name: Semgrep ci fixture
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 # 2026-11-17
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # On a pull request, semgrep ci checks out the head sha from the event
      # and scans only files changed since the base. A file already on that
      # head is invisible once the pull request merges. Commit the hit during
      # the job and replace the event's head sha with that commit so the scan
      # sees a file that is new on every run. GitHub ignores a step-level
      # override of GITHUB_BASE_REF, so the baseline stays the real base.
      - name: Commit a new Semgrep hit
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email fixture@example.com
          git config --global user.name fixture
          mkdir -p fixtures/semgrep
          printf '%s\n' fixture-semgrep-hit > fixtures/semgrep/ci-hit.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            head=$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')
            git cat-file -e "$head^{commit}" || git fetch origin "$head"
            git checkout --detach "$head"
            git add fixtures/semgrep/ci-hit.txt
            tree=$(git write-tree)
            parent=$(git rev-parse "$head^")
            new=$(git commit-tree "$tree" -p "$parent" -m "fixture semgrep hit")
            git replace "$head" "$new"
          else
            git add fixtures/semgrep/ci-hit.txt
            git commit -m "fixture semgrep hit"
          fi

      - name: Run semgrep ci with the fixture rule
        uses: ./semgrep
        with:
          mode: ci
          rules: fixtures/semgrep/rule.yml
          upload: "false"

      - name: Expect the ci scan to report the fixture hit
        shell: sh
        run: |
          test -f semgrep-results.sarif
          python3 -c 'import json,sys; payload=json.load(open("semgrep-results.sarif")); count=sum(len(run.get("results") or []) for run in payload.get("runs") or []); sys.exit(0 if count >= 1 else 1)'

  semgrep-ci-error:
    name: Semgrep ci error fixture
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 # 2026-11-17
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject a missing ci config
        id: scan
        continue-on-error: true
        uses: ./semgrep
        with:
          mode: ci
          rules: fixtures/semgrep/missing.yml
          upload: "false"

      - name: Expect the action to fail
        shell: sh
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  semgrep-mode-fail:
    name: Semgrep mode fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject a mode that is not scan or ci
        id: scan
        continue-on-error: true
        uses: ./semgrep
        with:
          mode: nope
          rules: fixtures/semgrep/rule.yml
          source: fixtures/semgrep/pass
          upload: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  pip-audit-pass:
    name: pip-audit pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit an empty requirements file
        uses: ./pip-audit
        with:
          requirements: fixtures/pip-audit/pass/requirements.txt

  pip-audit-fail:
    name: pip-audit fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit a known vulnerable pin
        id: scan
        continue-on-error: true
        uses: ./pip-audit
        with:
          requirements: fixtures/pip-audit/fail/requirements.txt

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  bandit-pass:
    name: Bandit pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a file with no findings
        uses: ./bandit
        with:
          paths: app.py
          root: fixtures/bandit/pass

  bandit-fail:
    name: Bandit fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a file that calls eval
        id: scan
        continue-on-error: true
        uses: ./bandit
        with:
          paths: app.py
          root: fixtures/bandit/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  npm-audit-pass:
    name: npm audit pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          install: "false"

      - name: Audit a lockfile with no vulnerabilities
        uses: ./npm-audit
        with:
          directories: fixtures/node-lockfiles/pass

  npm-audit-fail:
    name: npm audit fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          install: "false"

      - name: Audit a lockfile with a high finding
        id: scan
        continue-on-error: true
        uses: ./npm-audit
        with:
          directories: fixtures/npm-audit/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  playwright-pass:
    name: Playwright install pass fixture
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          cache: npm
          working-directory: fixtures/playwright

      - name: Install Chromium, falling back if apt fails
        uses: ./playwright-install
        with:
          working-directory: fixtures/playwright
          browsers: chromium

  playwright-fail:
    name: Playwright install fail fixture
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          cache: npm
          working-directory: fixtures/playwright

      - name: Reject an unknown browser
        id: scan
        continue-on-error: true
        uses: ./playwright-install
        with:
          working-directory: fixtures/playwright
          browsers: not-a-browser

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  cdk-bootstrap-pass:
    name: CDK bootstrap check pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A stub. The job does not call AWS.
      - name: Install a stub aws
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/aws" << 'EOF'
          #!/bin/sh
          echo 21
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/bin/aws"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check bootstrap
        uses: ./cdk-bootstrap-check
        with:
          qualifier: hnb659fds
          region: ap-southeast-1

  cdk-bootstrap-fail:
    name: CDK bootstrap check fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An empty region fails before aws is invoked.
      - name: Reject a missing region
        id: bootstrap
        continue-on-error: true
        uses: ./cdk-bootstrap-check
        with:
          qualifier: ""
          region: ""

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.bootstrap.outcome }}
        run: test "$OUTCOME" = "failure"

  cdk-diff-pass:
    name: CDK diff pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # A local bin so npx --no-install does not download CDK.
      - name: Install a stub cdk
        run: |
          mkdir -p "$RUNNER_TEMP/app/node_modules/.bin"
          printf '%s\n' '{"name":"cdk-diff-fixture","private":true}' > "$RUNNER_TEMP/app/package.json"
          cat > "$RUNNER_TEMP/app/node_modules/.bin/cdk" << 'EOF'
          #!/bin/sh
          echo "Stack app (aws://000000000000/ap-southeast-1)"
          echo "There were no differences"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/app/node_modules/.bin/cdk"

      - name: Run CDK diff
        uses: ./cdk-diff
        with:
          working-directory: ${{ runner.temp }}/app
          stacks: app
          account-id: "000000000000"
          summary: "true"

      # The job summary file is per step, so this reads the copy the
      # action writes for a later step.
      - name: The summary hides the account id
        run: |
          file="$RUNNER_TEMP/cdk-diff-summary.md"
          grep -F '### CDK diff' "$file"
          grep -F 'aws://***/ap-southeast-1' "$file"
          if grep -F '000000000000' "$file"; then
            echo "account id leaked into the summary"
            exit 1
          fi

      # A typo in working-directory must not look like a successful diff.
      - name: A missing package warns and succeeds
        uses: ./cdk-diff
        with:
          working-directory: ${{ runner.temp }}/missing
          stacks: ""
          account-id: "000000000000"
          summary: "false"

  cdk-diff-fail:
    name: CDK diff fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install a stub cdk that fails
        run: |
          mkdir -p "$RUNNER_TEMP/app/node_modules/.bin"
          printf '%s\n' '{"name":"cdk-diff-fixture","private":true}' > "$RUNNER_TEMP/app/package.json"
          cat > "$RUNNER_TEMP/app/node_modules/.bin/cdk" << 'EOF'
          #!/bin/sh
          echo "diff failed"
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/app/node_modules/.bin/cdk"

      - name: Run CDK diff
        id: diff
        continue-on-error: true
        uses: ./cdk-diff
        with:
          working-directory: ${{ runner.temp }}/app
          stacks: ""
          account-id: ""
          summary: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.diff.outcome }}
        run: test "$OUTCOME" = "failure"

  aws-oidc-skip:
    name: AWS OIDC skip fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No account and no region. required is false, so the assume step
      # does not run and this job does not request a token.
      - name: Skip when the account is unset
        id: aws
        uses: ./aws-oidc
        with:
          account-id: ""
          region: ""
          required: "false"

      - name: The step is not ready
        env:
          READY: ${{ steps.aws.outputs.ready }}
        run: test "$READY" = "false"

  aws-oidc-fail:
    name: AWS OIDC fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject a required account that is unset
        id: aws
        continue-on-error: true
        uses: ./aws-oidc
        with:
          account-id: ""
          region: ""
          required: "true"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.aws.outcome }}
        run: test "$OUTCOME" = "failure"

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - unit
      - require-jobs-pass
      - require-jobs-fail
      - setup-node-fixture
      - setup-node-fail
      - setup-node-unknown-cache
      - setup-python-fixture
      - setup-python-fail
      - verify-rulesets-pass
      - verify-rulesets-fail
      - pii-denylist-pass
      - pii-denylist-fail
      - gitleaks-pass
      - gitleaks-fail
      - checkov-skip
      - checkov-fail
      - codeql-fail
      - semgrep-lib-path
      - semgrep-fail
      - node-lockfiles-pass
      - node-lockfiles-fail
      - python-requirements-pass
      - python-requirements-fail
      - flutter-lockfiles-pass
      - flutter-lockfiles-fail
      - flutter-version-fail
      - pip-audit-pass
      - pip-audit-fail
      - bandit-pass
      - bandit-fail
      - npm-audit-pass
      - npm-audit-fail
      - playwright-pass
      - playwright-fail
      - pod-lockfiles-pass
      - pod-lockfiles-fail
      - agent-harness-pass
      - agent-harness-fail
      - semgrep-ci
      - semgrep-ci-error
      - semgrep-mode-fail
      - aws-oidc-skip
      - aws-oidc-fail
      - cdk-bootstrap-pass
      - cdk-bootstrap-fail
      - cdk-diff-pass
      - cdk-diff-fail
    if: always()
    steps:
      # Pinned to the merge on main. See the matching comment in lint.yml.
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
