name: Test

# main-protection applies. The check named test is required on main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  require-jobs-pass:
    name: Require jobs pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load passing fixture
        id: pass
        run: |
          {
            echo "needs-json<<EOF"
            cat fixtures/require-jobs/pass/needs.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require jobs
        uses: ./require-jobs
        with:
          needs-json: ${{ steps.pass.outputs.needs-json }}

  require-jobs-fail:
    name: Require jobs fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load failing fixture
        id: fail
        run: |
          {
            echo "needs-json<<EOF"
            cat fixtures/require-jobs/fail/needs.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require jobs
        id: require
        continue-on-error: true
        uses: ./require-jobs
        with:
          needs-json: ${{ steps.fail.outputs.needs-json }}

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.require.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-node-fixture:
    name: Setup Node fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No working-directory and no cache. This is the call site that only
      # sets up Node. Default node-version is 26.
      - name: Set up Node with no cache and no project
        uses: ./setup-node

      - name: The default Node major is 26
        shell: bash
        run: node --version | grep -E '^v26\.'

      - name: Cache npm and install the fixture
        uses: ./setup-node
        with:
          cache: npm
          working-directory: fixtures/setup-node

  setup-node-fail:
    name: Setup Node fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache a directory that has no lockfile
        id: setup
        continue-on-error: true
        uses: ./setup-node
        with:
          cache: npm
          working-directory: fixtures/setup-node-no-lock
          install: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-node-unknown-cache:
    name: Setup Node unknown cache
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pass a cache value the action does not support
        id: setup
        continue-on-error: true
        uses: ./setup-node
        with:
          cache: yarn

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-python-fixture:
    name: Setup Python fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Empty requirements sets up Python with no pip cache.
      - name: Set up Python with no cache
        uses: ./setup-python

      - name: The default Python is 3.12
        shell: bash
        run: python --version | grep -E 'Python 3\.12\.'

      - name: Set up Python and cache pip
        uses: ./setup-python
        with:
          requirements: fixtures/setup-python/requirements.txt

  setup-python-fail:
    name: Setup Python fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache a requirements file that is not there
        id: setup
        continue-on-error: true
        uses: ./setup-python
        with:
          requirements: fixtures/setup-python/does-not-exist.txt

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = "failure"

  verify-rulesets-pass:
    name: Verify rulesets pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the passing ruleset
        id: pass
        run: |
          {
            echo "rulesets-json<<EOF"
            cat fixtures/verify-rulesets/pass.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify rulesets
        uses: ./verify-rulesets
        with:
          rulesets-json: ${{ steps.pass.outputs.rulesets-json }}

  verify-rulesets-fail:
    name: Verify rulesets fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load the failing ruleset
        id: fail
        run: |
          {
            echo "rulesets-json<<EOF"
            cat fixtures/verify-rulesets/fail.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify rulesets
        id: verify
        continue-on-error: true
        uses: ./verify-rulesets
        with:
          rulesets-json: ${{ steps.fail.outputs.rulesets-json }}

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.verify.outcome }}
        run: test "$OUTCOME" = "failure"

  pii-denylist-pass:
    name: PII denylist pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree that does not match the denylist
        uses: ./pii-denylist
        with:
          denylist-path: denylist.sha256
          root: fixtures/pii-denylist/pass

  pii-denylist-fail:
    name: PII denylist fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree that matches the denylist
        id: scan
        continue-on-error: true
        uses: ./pii-denylist
        with:
          denylist-path: denylist.sha256
          root: fixtures/pii-denylist/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  gitleaks-pass:
    name: Gitleaks pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree with no secret
        uses: ./gitleaks
        with:
          source: fixtures/gitleaks/pass

  gitleaks-fail:
    name: Gitleaks fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create a throwaway repository with one leak
        run: |
          root="$RUNNER_TEMP/gitleaks-fail"
          mkdir -p "$root"
          git -C "$root" init
          prefix=ghp_
          body=A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8
          printf 'token=%s%s\n' "$prefix" "$body" > "$root/secret.txt"
          git -C "$root" add secret.txt
          git -C "$root" -c user.email=fixture@example.com -c user.name=fixture commit -m fixture

      - name: Scan a tree with an access key
        id: scan
        continue-on-error: true
        uses: ./gitleaks
        with:
          source: ${{ runner.temp }}/gitleaks-fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  checkov-skip:
    name: Checkov missing directory
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip a directory that is not there
        uses: ./checkov-cloudformation
        with:
          directory: fixtures/checkov/missing
          skip-if-missing: "true"

  checkov-fail:
    name: Checkov fail fixture
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a public bucket
        id: scan
        continue-on-error: true
        uses: ./checkov-cloudformation
        with:
          directory: fixtures/checkov/fail
          upload: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  codeql-fail:
    name: CodeQL fail fixture
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject a missing language
        id: scan
        continue-on-error: true
        uses: ./codeql
        with:
          language: ""

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  semgrep-lib-path:
    name: Semgrep shared library path
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a clean tree inside the Semgrep container
        uses: ./semgrep
        with:
          rules: fixtures/semgrep/rule.yml
          source: fixtures/semgrep/pass

  semgrep-fail:
    name: Semgrep fail fixture
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan a tree the fixture rule matches
        id: scan
        continue-on-error: true
        uses: ./semgrep
        with:
          rules: fixtures/semgrep/rule.yml
          source: fixtures/semgrep/fail
          upload: "false"

      - name: Expect findings and a resolved library path
        shell: sh
        run: |
          test -f semgrep-results.sarif
          python3 -c 'import json,sys; payload=json.load(open("semgrep-results.sarif")); count=sum(len(run.get("results") or []) for run in payload.get("runs") or []); sys.exit(0 if count == 1 else 1)'

  node-lockfiles-pass:
    name: Node lockfile pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          install: "false"

      - name: Check a lockfile that matches
        uses: ./node-lockfiles
        with:
          directories: fixtures/node-lockfiles/pass

  node-lockfiles-fail:
    name: Node lockfile fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./setup-node
        with:
          install: "false"

      - name: Check a directory with no lockfile
        id: scan
        continue-on-error: true
        uses: ./node-lockfiles
        with:
          directories: fixtures/node-lockfiles/fail

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  python-requirements-pass:
    name: Python pins pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pinned requirements
        uses: ./python-requirements-pins
        with:
          files: fixtures/python-requirements/pass/requirements.txt

  python-requirements-fail:
    name: Python pins fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check an unpinned requirement
        id: scan
        continue-on-error: true
        uses: ./python-requirements-pins
        with:
          files: fixtures/python-requirements/fail/requirements.txt

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  flutter-lockfiles-pass:
    name: Flutter lockfile pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip a directory with no pubspec
        uses: ./flutter-lockfiles
        with:
          working-directory: fixtures/flutter-lockfiles/pass
          setup: "false"

  flutter-lockfiles-fail:
    name: Flutter lockfile fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub flutter so the lockfile changes
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/flutter" << 'EOF'
          #!/bin/sh
          printf 'rewritten\n' > pubspec.lock
          EOF
          chmod +x "$RUNNER_TEMP/bin/flutter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check a lockfile the stub rewrites
        id: scan
        continue-on-error: true
        uses: ./flutter-lockfiles
        with:
          working-directory: fixtures/flutter-lockfiles/fail
          setup: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  pod-lockfiles-pass:
    name: Pod lockfile pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip a directory with no Podfile
        uses: ./pod-lockfiles
        with:
          working-directory: fixtures/pod-lockfiles/pass
          setup: "false"

  pod-lockfiles-fail:
    name: Pod lockfile fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub pod so the lockfile changes
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/pod" << 'EOF'
          #!/bin/sh
          printf 'rewritten\n' > Podfile.lock
          EOF
          chmod +x "$RUNNER_TEMP/bin/pod"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check a lockfile the stub rewrites
        id: scan
        continue-on-error: true
        uses: ./pod-lockfiles
        with:
          working-directory: fixtures/pod-lockfiles/fail
          setup: "false"

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - unit
      - require-jobs-pass
      - require-jobs-fail
      - setup-node-fixture
      - setup-node-fail
      - setup-node-unknown-cache
      - setup-python-fixture
      - setup-python-fail
      - verify-rulesets-pass
      - verify-rulesets-fail
      - pii-denylist-pass
      - pii-denylist-fail
      - gitleaks-pass
      - gitleaks-fail
      - checkov-skip
      - checkov-fail
      - codeql-fail
      - semgrep-lib-path
      - semgrep-fail
      - node-lockfiles-pass
      - node-lockfiles-fail
      - python-requirements-pass
      - python-requirements-fail
      - flutter-lockfiles-pass
      - flutter-lockfiles-fail
      - pod-lockfiles-pass
      - pod-lockfiles-fail
    if: always()
    steps:
      # Pinned to the merge on main. See the matching comment in lint.yml.
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
