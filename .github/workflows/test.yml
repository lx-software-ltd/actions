name: Test

# main-protection does not apply to this repository. A green test check
# does not block a merge until the owner attaches that ruleset.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  require-jobs-pass:
    name: Require jobs pass fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load passing fixture
        id: pass
        run: |
          {
            echo "needs-json<<EOF"
            cat fixtures/require-jobs/pass/needs.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require jobs
        uses: ./require-jobs
        with:
          needs-json: ${{ steps.pass.outputs.needs-json }}

  require-jobs-fail:
    name: Require jobs fail fixture
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load failing fixture
        id: fail
        run: |
          {
            echo "needs-json<<EOF"
            cat fixtures/require-jobs/fail/needs.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require jobs
        id: require
        continue-on-error: true
        uses: ./require-jobs
        with:
          needs-json: ${{ steps.fail.outputs.needs-json }}

      - name: Expect the action to fail
        env:
          OUTCOME: ${{ steps.require.outcome }}
        run: test "$OUTCOME" = "failure"

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - unit
      - require-jobs-pass
      - require-jobs-fail
    if: always()
    steps:
      # Pinned to the merge on main. See the matching comment in lint.yml.
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@1a3cca7c38163f8164c262323601c34a4df5b7a4 # main 2026-11-20
        with:
          needs-json: ${{ toJson(needs) }}
