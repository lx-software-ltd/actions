version: 2

updates:
  # `/` covers .github/workflows. `/*` covers each top-level action
  # directory. GitHub's github-actions ecosystem does not look in
  # subdirectories when directory is only `/`.
  # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/*"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
  # Fail fixtures must stay vulnerable. A security bump that makes one
  # install cleanly turns the fixture green. Only directories that hold
  # a manifest for that ecosystem are listed. A glob would include
  # directories Dependabot rejects for having no manifest.
  - package-ecosystem: pip
    directories:
      - "/fixtures/pip-audit/fail"
      - "/fixtures/python-requirements/fail"
      - "/fixtures/dependency-graph/fail"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
    labels:
      - dependencies
  - package-ecosystem: npm
    directories:
      - "/fixtures/npm-audit/fail"
      - "/fixtures/node-lockfiles/fail"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
    labels:
      - dependencies
