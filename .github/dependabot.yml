version: 2

updates:
  # `/` covers .github/workflows. `/*` covers each top-level action
  # directory. GitHub's github-actions ecosystem does not look in
  # subdirectories when directory is only `/`.
  # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/*"
    schedule:
      interval: weekly
      day: monday
    # The platform default is 3 days. The exclude is this repository,
    # so a tag on main is not held. Other actions stay on 3 days.
    cooldown:
      default-days: 3
      exclude:
        - "lx-software-ltd/actions/*"
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
  # Fail fixtures that stay on main. A bump that makes one install
  # cleanly turns the fixture green. Only directories that hold a
  # manifest for that ecosystem are listed. A glob would include
  # directories Dependabot rejects for having no manifest.
  #
  # The pip-audit and npm-audit vulnerable pins are written in the test
  # job under RUNNER_TEMP. They are not files on main, so they are not
  # in the dependency graph.
  #
  # ignore stops the pull request. Organisation grouped security updates
  # record all_versions_ignored and fail the Dependabot job when an
  # advisory still matches an ignored dependency. A security-updates
  # group in this file is the grouping for these directories.
  # exclude-patterns covers every name, so each ignore is an individual
  # update and the job completes.
  - package-ecosystem: pip
    directories:
      - "/fixtures/python-requirements/fail"
      - "/fixtures/dependency-submission/fail"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
    groups:
      fail-fixtures:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "*"
    labels:
      - dependencies
  - package-ecosystem: npm
    directories:
      - "/fixtures/node-lockfiles/fail"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
    groups:
      fail-fixtures:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "*"
    labels:
      - dependencies
