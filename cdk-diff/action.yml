name: CDK diff
description: >-
  Run cdk diff, strip the account id from the log and the step summary,
  and keep the diff's exit code.

inputs:
  working-directory:
    description: Directory that contains the CDK app package.json.
    required: true
  stacks:
    description: >-
      A plan alias, or stack names separated by spaces or commas. The
      whole value is one alias when it matches. Empty passes no stack
      names, so CDK diffs every stack. With a plan, every name must be
      a stack in the groups, empty still routes parameters for every
      stack in the groups, and an alias expands before both the
      parameters and the command are built.
    required: false
    default: ""
  args:
    description: >-
      Extra arguments, split on whitespace, placed before the stack
      names. Use args-file when a value contains spaces.
    required: false
    default: ""
  args-file:
    description: >-
      Path to a null-delimited argument list. Used instead of args when
      it is set. Appended after the plan parameters.
    required: false
    default: ""
  plan:
    description: >-
      The same JSON as cdk-deploy. Empty uses args only. {NAME} in
      extra-args expands when include-extras is true. An empty value
      stays in the argument.
    required: false
    default: ""
  plan-file:
    description: Path to that JSON. Set plan or plan-file, not both.
    required: false
    default: ""
  param-file:
    description: Parameters file, the same input cdk-deploy takes.
    required: false
    default: ""
  format:
    description: prefixed-json or plain-json.
    required: false
    default: prefixed-json
  pass-empty:
    description: Comma-separated names sent when the value is empty.
    required: false
    default: ""
  escape-newlines:
    description: Escape newlines in plain-json values.
    required: false
    default: "false"
  include-extras:
    description: >-
      When true, include extra-args, append-if-set, and when-all-env.
      A diff leaves this false so it only routes the parameters file.
    required: false
    default: "false"
  account-id:
    description: >-
      Account id from secrets.AWS_ACCOUNT_ID. Stripped from the log and
      the step summary. A variable is printed in the step header before
      any mask runs. Empty leaves the text unchanged.
    required: true
  summary:
    description: >-
      When true, write the masked diff to the step summary. Default
      true. false keeps a caller that does not write a summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Run CDK diff
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STACKS: ${{ inputs.stacks }}
        ARGS: ${{ inputs.args }}
        ARGS_FILE: ${{ inputs.args-file }}
        PLAN: ${{ inputs.plan }}
        PLAN_FILE: ${{ inputs.plan-file }}
        PARAM_FILE: ${{ inputs.param-file }}
        FORMAT: ${{ inputs.format }}
        PASS_EMPTY: ${{ inputs.pass-empty }}
        ESCAPE_NEWLINES: ${{ inputs.escape-newlines }}
        INCLUDE_EXTRAS: ${{ inputs.include-extras }}
        ACCOUNT_ID: ${{ inputs.account-id }}
        SUMMARY: ${{ inputs.summary }}
      run: python3 "$GITHUB_ACTION_PATH/cdk_diff.py"
