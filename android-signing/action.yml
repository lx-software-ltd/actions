name: Android signing
description: Decode the release keystore, or skip when a signing secret is missing.

inputs:
  working-directory:
    description: Flutter app directory.
    required: true
  keystore-base64:
    description: Base64-encoded keystore. The caller passes the secret.
    required: false
    default: ""
  keystore-password:
    description: Keystore password.
    required: false
    default: ""
  key-password:
    description: Key password.
    required: false
    default: ""
  key-alias:
    description: Key alias.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure Android signing
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ANDROID_KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_PASSWORD: ${{ inputs.key-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
      run: sh "$GITHUB_ACTION_PATH/install_keystore.sh"
