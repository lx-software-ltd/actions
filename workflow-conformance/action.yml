name: Workflow conformance
description: >-
  Check workflows against the CI contract. enforce fails when there is
  a finding. warn prints findings and passes.

inputs:
  mode:
    description: enforce or warn.
    required: false
    default: enforce
  root:
    description: Directory to check. Empty uses the workspace.
    required: false
    default: ""
  profile:
    description: product requires the target security jobs and semgrep/ci. producer is this repository.
    required: false
    default: product

runs:
  using: composite
  steps:
    - name: Check workflow conformance
      shell: bash
      env:
        CONFORMANCE_MODE: ${{ inputs.mode }}
        CONFORMANCE_PROFILE: ${{ inputs.profile }}
        CONFORMANCE_ROOT: ${{ inputs.root }}
      run: python3 "$GITHUB_ACTION_PATH/check_workflows.py"
