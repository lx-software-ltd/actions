name: Workflow conformance
description: >-
  Check workflows against the CI contract. enforce fails when there is
  a finding. warn prints findings and passes.

inputs:
  mode:
    description: enforce or warn.
    required: false
    default: enforce
  root:
    description: Directory to check. Empty uses the workspace.
    required: false
    default: ""
  profile:
    description: >-
      product requires the security jobs, semgrep/ci in security.yml,
      and the lint lockfile jobs. producer is this repository.
    required: false
    default: product
  alignment:
    description: >-
      warn or enforce for the product alignment checks. warn prints
      them and does not fail. enforce makes them findings for this
      caller.
    required: false
    default: enforce
  templates:
    description: >-
      off, warn, or enforce. warn compares a product workflow with
      templates/workflows and does not fail. enforce makes a mismatch
      a finding. off skips the comparison. The producer profile skips it.
    required: false
    default: enforce

runs:
  using: composite
  steps:
    - name: Check workflow conformance
      shell: bash
      env:
        CONFORMANCE_MODE: ${{ inputs.mode }}
        CONFORMANCE_PROFILE: ${{ inputs.profile }}
        CONFORMANCE_ROOT: ${{ inputs.root }}
        CONFORMANCE_ALIGNMENT: ${{ inputs.alignment }}
        CONFORMANCE_TEMPLATES: ${{ inputs.templates }}
      run: python3 "$GITHUB_ACTION_PATH/check_workflows.py"
