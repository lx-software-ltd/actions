name: Workflow conformance
description: >-
  Check workflows against the CI contract. warn prints findings and
  passes. enforce fails when there is a finding.

inputs:
  mode:
    description: warn or enforce.
    required: false
    default: warn
  root:
    description: Directory to check. Empty uses the workspace.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check workflow conformance
      shell: bash
      env:
        CONFORMANCE_MODE: ${{ inputs.mode }}
        CONFORMANCE_ROOT: ${{ inputs.root }}
      run: python3 "$GITHUB_ACTION_PATH/check_workflows.py"
