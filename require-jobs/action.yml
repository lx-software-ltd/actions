name: Require jobs
description: >-
  Fail unless every job in needs succeeded, and write a result table to
  the step summary. A skipped job is a failure.

inputs:
  needs-json:
    description: >-
      JSON object of job id to result, or the GitHub needs context from
      toJson(needs). Required, and must be non-empty.
    required: true

runs:
  using: composite
  steps:
    - name: Require jobs
      shell: bash
      env:
        NEEDS_JSON: ${{ inputs.needs-json }}
      run: python3 "$GITHUB_ACTION_PATH/require_jobs.py"
