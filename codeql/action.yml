name: CodeQL
description: >-
  Initialize and analyze one CodeQL language. The category is the
  caller's, so the security tab keeps its existing grouping.

inputs:
  language:
    description: One CodeQL language, such as python or javascript.
    required: true
    default: ""
  queries:
    description: Query suite. Default security-extended.
    required: false
    default: security-extended
  config-file:
    description: Optional CodeQL config file. Empty omits the input.
    required: false
    default: ""
  category:
    description: Analyze category. Empty omits the input.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require a language
      if: inputs.language == ''
      shell: bash
      run: |
        echo "codeql: language is required" >&2
        exit 1

    - name: Select the query suite
      id: queries
      if: inputs.language != ''
      shell: bash
      env:
        CODEQL_LANGUAGE: ${{ inputs.language }}
        CODEQL_QUERIES: ${{ inputs.queries }}
        CODEQL_CONFIG_FILE: ${{ inputs.config-file }}
      run: bash "$GITHUB_ACTION_PATH/select_queries.sh"

    - name: Initialize CodeQL
      if: inputs.language != '' && inputs.config-file == ''
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ inputs.language }}
        queries: ${{ steps.queries.outputs.path }}

    - name: Initialize CodeQL with a config file
      if: inputs.language != '' && inputs.config-file != ''
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ inputs.language }}
        queries: ${{ steps.queries.outputs.path }}
        config-file: ${{ inputs.config-file }}

    - name: Perform CodeQL Analysis
      if: inputs.language != '' && inputs.category == ''
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        upload: never
        post-processed-sarif-path: ${{ github.workspace }}/.codeql-sarif
        wait-for-processing: false

    - name: Perform CodeQL Analysis with a category
      if: inputs.language != '' && inputs.category != ''
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: ${{ inputs.category }}
        upload: never
        post-processed-sarif-path: ${{ github.workspace }}/.codeql-sarif
        wait-for-processing: false

    - name: Drop in-source suppressions
      if: success() && inputs.language != ''
      shell: bash
      env:
        SARIF_DIR: ${{ github.workspace }}/.codeql-sarif
      run: bash "$GITHUB_ACTION_PATH/filter_results.sh"

    - name: Upload SARIF results
      if: success() && inputs.language != '' && inputs.category == ''
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ github.workspace }}/.codeql-sarif
        wait-for-processing: false

    - name: Upload SARIF results with a category
      if: success() && inputs.language != '' && inputs.category != ''
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ github.workspace }}/.codeql-sarif
        category: ${{ inputs.category }}
        wait-for-processing: false
