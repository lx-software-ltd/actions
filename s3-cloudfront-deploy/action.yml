name: S3 CloudFront deploy
description: >-
  Sync a built site to S3 and invalidate CloudFront. The profile keeps
  the cache and content-type rules of that site.

inputs:
  source:
    description: >-
      Build directory to upload. Empty when promote-from copies an
      existing release prefix.
    required: false
    default: ""
  bucket:
    description: >-
      Destination bucket. Empty when stack is set: the action reads
      bucket-output from that stack.
    required: false
    default: ""
  stack:
    description: >-
      CloudFormation stack whose outputs name the bucket and the
      distribution. Empty keeps bucket and distribution-id.
    required: false
    default: ""
  region:
    description: AWS region for the stack read. Required when stack is set.
    required: false
    default: ""
  bucket-output:
    description: Output key for the bucket. Used when stack is set.
    required: false
    default: PublicWebsiteBucketName
  distribution-output:
    description: >-
      Output key for the distribution when stack is set. Empty keeps
      distribution-id.
    required: false
    default: PublicWebsiteDistributionId
  distribution-id:
    description: CloudFront distribution. Empty skips the invalidation.
    required: false
    default: ""
  profile:
    description: >-
      public-hashed, admin-hashed, public-routes, next-export
      (a Next.js out/ directory, synced with --delete), next-site
      (immutable _next/static, then short-cache documents), or
      maintenance (no-store, excluding releases/).
    required: false
    default: public-hashed
  indexnow:
    description: >-
      Ping IndexNow after public-routes. false keeps the other profiles
      from pinging. INDEXNOW_DISABLED=1 still skips the ping.
    required: false
    default: "false"
  dry-run:
    description: >-
      Pass --dryrun to every aws s3 command and skip the CloudFront
      invalidation. IndexNow is skipped too.
    required: false
    default: "false"
  release-id:
    description: >-
      Copy the next-site upload to releases/<id>/ after the live sync.
      Empty skips the copy. Letters, digits, dot, dash, or underscore.
    required: false
    default: ""
  release-marker:
    description: >-
      When true with release-id, write releases/latest-release-id.txt.
      The object has no cache header.
    required: false
    default: "false"
  staging-robots:
    description: >-
      Upload a deny-all robots.txt with no-store. Used for staging.
    required: false
    default: "false"
  promote-from:
    description: >-
      s3://bucket/releases/<id>. Copies that prefix to the destination
      with the next-site cache rules. Requires profile next-site.
    required: false
    default: ""
  sync-exclude:
    description: >-
      Extra aws s3 sync --exclude patterns for next-site, comma-separated.
      _next/static/* and releases/* are always excluded from the document sync.
    required: false
    default: ""
  delete-prefix:
    description: >-
      One directory removed with aws s3 rm --recursive after the next-site
      asset sync and before the document sync. Empty skips it. siutindei
      production passes fixtures. Requires profile next-site.
    required: false
    default: ""
  asset-cache:
    description: >-
      Cache-Control for _next/static. The default matches the public-www
      scripts.
    required: false
    default: "public, max-age=31536000, immutable"
  document-cache:
    description: >-
      Cache-Control for the remaining next-site files. siutindei passes
      public, max-age=300, must-revalidate, stale-while-revalidate=60.
    required: false
    default: "public, max-age=300, must-revalidate"
  marker-cache:
    description: >-
      Cache-Control for releases/latest-release-id.txt. Empty writes the
      marker with no cache header.
    required: false
    default: ""
  marker-content-type:
    description: Content-Type for the release marker. Empty omits the header.
    required: false
    default: ""
  maintenance-assets:
    description: >-
      One directory, such as images, synced before the no-store maintenance
      upload and then excluded from it. Empty keeps a single sync.
    required: false
    default: ""
  maintenance-asset-cache:
    description: Cache-Control for maintenance-assets.
    required: false
    default: "public, max-age=3600, must-revalidate"

runs:
  using: composite
  steps:
    - name: Sync the build and invalidate CloudFront
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        BUCKET: ${{ inputs.bucket }}
        DISTRIBUTION_ID: ${{ inputs.distribution-id }}
        STACK: ${{ inputs.stack }}
        AWS_REGION: ${{ inputs.region }}
        BUCKET_OUTPUT: ${{ inputs.bucket-output }}
        DISTRIBUTION_OUTPUT: ${{ inputs.distribution-output }}
        PROFILE: ${{ inputs.profile }}
        INDEXNOW: ${{ inputs.indexnow }}
        DRY_RUN: ${{ inputs.dry-run }}
        RELEASE_ID: ${{ inputs.release-id }}
        RELEASE_MARKER: ${{ inputs.release-marker }}
        STAGING_ROBOTS: ${{ inputs.staging-robots }}
        PROMOTE_FROM: ${{ inputs.promote-from }}
        SYNC_EXCLUDE: ${{ inputs.sync-exclude }}
        DELETE_PREFIX: ${{ inputs.delete-prefix }}
        ASSET_CACHE: ${{ inputs.asset-cache }}
        DOCUMENT_CACHE: ${{ inputs.document-cache }}
        MARKER_CACHE: ${{ inputs.marker-cache }}
        MARKER_CONTENT_TYPE: ${{ inputs.marker-content-type }}
        MAINTENANCE_ASSETS: ${{ inputs.maintenance-assets }}
        MAINTENANCE_ASSET_CACHE: ${{ inputs.maintenance-asset-cache }}
      run: python3 "$GITHUB_ACTION_PATH/s3_sync.py"
