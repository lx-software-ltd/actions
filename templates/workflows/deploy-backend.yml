name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      # template:optional migration-recovery
      destroy_before_deploy:
        description: "Run cdk destroy before deploy"
        required: false
        default: false
        type: boolean
      # template:end
      # template:optional database
      force_migration_run:
        description: "Force RunMigrations custom resource"
        required: false
        default: false
        type: boolean
      # template:end
      cdk_stacks:
        description: "CDK stacks to deploy"
        required: false
        default: "all stacks"
        type: choice
        options:
          # template:set
          - "example"
          # template:end
      # template:optional database
      run_seed_data:
        description: "Run seed data after migrations (backend stack only)"
        required: false
        default: false
        type: boolean
      # template:end
  push:
    branches:
      - main
    # template:set
          example-field: example-value
    # template:end

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # template:optional search-fixture
      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend

      # template:end

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24

      - name: Determine deployment region
        id: region
        env:
          INPUT_CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          INPUT_AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash scripts/deploy/cdk-prepare.sh region

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ steps.region.outputs.region }}

      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64


      - name: Check CDK bootstrap
        uses: lx-software-ltd/actions/cdk-bootstrap-check@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ steps.region.outputs.region }}
      - name: Prepare CDK app
        id: prep
        run: bash scripts/deploy/cdk-prepare.sh deploy
        # template:set
          example-field: example-value
        # template:end

      # template:optional edge-verify
      - name: Read edge verify before deploy
        id: edge_before
        if: steps.prep.outputs.edge_verify == 'true'
        uses: lx-software-ltd/actions/cfn-stack-outputs@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          # template:set
          stack: stack-name
          # template:end
          optional: PublicWwwStagingEdgeVerifyEnabled PublicWwwEdgeVerifyEnabled
          allow-missing: "true"
          region: ${{ steps.region.outputs.region }}

      # template:end

      - name: Deploy stacks
        uses: lx-software-ltd/actions/cdk-deploy@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          plan-file: backend/infrastructure/cdk-plan.json
          # template:set
          example-field: example-value
          # template:end
          param-file: ${{ vars.CDK_PARAM_FILE }}
          attempts: "3"
          # template:set
          format: json-format
          pass-empty: ExampleOutput
          # template:end
          region: ${{ steps.region.outputs.region }}
        # template:set
          example-field: example-value
        # template:end
      # template:optional edge-verify
      - name: Read edge verify after deploy
        id: edge_after
        if: steps.prep.outputs.edge_verify == 'true'
        uses: lx-software-ltd/actions/cfn-stack-outputs@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          # template:set
          stack: stack-name
          # template:end
          optional: PublicWwwStagingEdgeVerifyEnabled PublicWwwEdgeVerifyEnabled
          allow-missing: "true"
          region: ${{ steps.region.outputs.region }}

      - name: Report public website edge verify
        if: steps.prep.outputs.edge_verify == 'true'
        env:
          BEFORE: ${{ steps.edge_before.outputs.json }}
          AFTER: ${{ steps.edge_after.outputs.json }}
        run: |
          set -euo pipefail
          one() {
            DOC="$1" python3 -c 'import json,os,sys; data=json.loads(os.environ["DOC"]); value=data.get(sys.argv[1]) or ""; print(value or "absent")' "$2"
          }
          bash "${GITHUB_WORKSPACE}/scripts/deploy/report_public_www_edge_verify.sh" \
            "$(one "$BEFORE" PublicWwwStagingEdgeVerifyEnabled)" \
            "$(one "$AFTER" PublicWwwStagingEdgeVerifyEnabled)" \
            "$(one "$BEFORE" PublicWwwEdgeVerifyEnabled)" \
            "$(one "$AFTER" PublicWwwEdgeVerifyEnabled)"

      # template:end
