name: CDK Diff

on:
  pull_request:
    paths:
# template:set
      - "backend/**"
      - ".github/workflows/cdk-diff.yml"
# template:end
  repository_dispatch:
    types: [cdk-diff]
  workflow_dispatch:
    inputs:
      stacks:
# template:set
        description: 'Optional space/comma-separated CDK stack names'
# template:end
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cdk-diff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diff:
# template:optional production-diff
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request') }}
    environment: production
# template:end
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    env:
      CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
# template:set
# template:end

# template:optional search-fixture
      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend
# template:end

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure
# template:set
# template:end
      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24

# template:optional waf-region
      - name: Determine deployment region
        id: region
        env:
          INPUT_CDK_STACKS: ${{ inputs.stacks }}
          INPUT_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ "$INPUT_CDK_STACKS" = "waf (us-east-1)" ] || \
            [ "$INPUT_CDK_STACKS" = "lxsoftware-siutindei-waf" ]; then
            echo "region=us-east-1" >> "$GITHUB_OUTPUT"
          else
            echo "region=$INPUT_AWS_REGION" >> "$GITHUB_OUTPUT"
          fi
# template:end


# template:optional diff-role-guard
      - name: Refuse the deploy role on a pull request
        if: github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_NAME == 'GitHubActionsRole'
        run: |
          echo "::error::AWS_DIFF_ROLE_NAME must name a read-only role. A pull request does not assume GitHubActionsRole."
          exit 1
# template:end

      - name: Configure AWS credentials
        id: aws
# template:optional diff-role
        if: github.event_name != 'pull_request' || vars.AWS_DIFF_ROLE_NAME != ''
# template:end
        uses: lx-software-ltd/actions/aws-oidc@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
# template:set
          region: ${{ vars.AWS_REGION }}
          role-name: ${{ github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_NAME || 'GitHubActionsRole' }}
          required: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
# template:end

# template:optional diff-note
      - name: Note when a pull request diff did not run
        if: github.event_name == 'pull_request' && steps.aws.outputs.ready != 'true'
        run: |
          echo "::warning::This pull request did not assume a role. Set AWS_DIFF_ROLE_NAME to a read-only role that trusts only pull_request. GitHubActionsRole is not assumed from a pull request."
# template:end


# template:optional qemu
# template:set
      # `cdk diff` synthesizes with asset bundling. The arm64 image needs
      # QEMU on an x86-64 runner.
# template:end
      - name: Set up QEMU for arm64 Lambda bundling
        if: steps.aws.outputs.ready == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
# template:end

      - name: Check CDK Bootstrap status
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/cdk-bootstrap-check@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
# template:set
          region: ${{ vars.AWS_REGION }}
# template:end

      - name: Prepare CDK app
        if: steps.aws.outputs.ready == 'true'
        id: prep
        run: bash scripts/deploy/cdk-prepare.sh diff
# template:set
        env:
          CDK_STACKS: ${{ inputs.stacks }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
# template:end

      - name: Run CDK diff
        if: steps.aws.outputs.ready == 'true' && steps.prep.outputs.run == 'true'
        uses: lx-software-ltd/actions/cdk-diff@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          stacks: ${{ steps.prep.outputs.stacks }}
          plan-file: backend/infrastructure/cdk-plan.json
          args-file: ${{ runner.temp }}/cdk-args
# template:set
          param-file: ${{ vars.CDK_PARAM_FILE }}
          format: plain-json
          pass-empty: WafWebAclArn,PublicWwwEdgeVerifySecret,PublicWwwEdgeVerifySecretPrevious,PublicWwwStagingEdgeVerifySecret,PublicWwwStagingEdgeVerifySecretPrevious
# template:end
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
# template:set
# template:end
# template:optional pull-request-diff
  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24

      - name: Refuse the deploy role on a pull request
        if: vars.AWS_DIFF_ROLE_NAME == 'GitHubActionsRole'
        run: |
          echo "::error::AWS_DIFF_ROLE_NAME must name a read-only role. A pull request does not assume GitHubActionsRole."
          exit 1

      - name: Configure AWS credentials
        id: aws
        if: vars.AWS_DIFF_ROLE_NAME != ''
        uses: lx-software-ltd/actions/aws-oidc@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}
          role-name: ${{ vars.AWS_DIFF_ROLE_NAME }}
          required: "false"

      - name: Note when a pull request diff did not run
        if: steps.aws.outputs.ready != 'true'
        run: |
          echo "::warning::This pull request did not assume a role. Set AWS_DIFF_ROLE_NAME to a read-only role that trusts only pull_request. GitHubActionsRole is not assumed from a pull request."

      - name: Check CDK Bootstrap status
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/cdk-bootstrap-check@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Run CDK diff
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/cdk-diff@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          stacks: "all stacks"
          plan-file: backend/infrastructure/cdk-plan.json
          param-file: ${{ vars.CDK_PARAM_FILE }}
          format: plain-json
          pass-empty: WafWebAclArn,CognitoCustomDomainName,CognitoCustomDomainCertificateArn,ApiCustomDomainName,ApiCustomDomainCertificateArn,SearchAreaScope
          escape-newlines: "true"
          include-extras: "false"
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
# template:end
