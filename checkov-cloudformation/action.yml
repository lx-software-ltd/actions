name: Checkov CloudFormation
description: >-
  Run Checkov on a synthesised CloudFormation directory, drop findings
  suppressed in source, and upload SARIF. An upload error does not fail
  the step.

inputs:
  directory:
    description: Directory of synthesised templates. The caller runs synth.
    required: true
    default: ""
  config-file:
    description: Checkov config file. Empty uses Checkov's defaults.
    required: false
    default: ""
  skip-if-missing:
    description: When true, a missing directory writes an empty SARIF and passes.
    required: false
    default: "false"
  upload:
    description: When false, do not upload SARIF. Fixtures use this.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: See whether the template directory is there
      id: templates
      shell: bash
      env:
        CHECKOV_DIRECTORY: ${{ inputs.directory }}
        CHECKOV_SKIP_IF_MISSING: ${{ inputs.skip-if-missing }}
      run: |
        if [ -z "$CHECKOV_DIRECTORY" ]; then
          echo "checkov-cloudformation: directory is required" >&2
          exit 1
        fi
        if [ ! -d "$CHECKOV_DIRECTORY" ]; then
          if [ "$CHECKOV_SKIP_IF_MISSING" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "checkov-cloudformation: missing $CHECKOV_DIRECTORY" >&2
          exit 1
        fi
        echo "present=true" >> "$GITHUB_OUTPUT"

    - name: Run Checkov
      if: steps.templates.outputs.present == 'true' && inputs.config-file == ''
      uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
      with:
        directory: ${{ inputs.directory }}
        framework: cloudformation
        output_format: cli,sarif
        output_file_path: console,checkov-results.sarif
        quiet: true

    - name: Run Checkov with a config file
      if: steps.templates.outputs.present == 'true' && inputs.config-file != ''
      uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
      with:
        directory: ${{ inputs.directory }}
        config_file: ${{ inputs.config-file }}
        framework: cloudformation
        output_format: cli,sarif
        output_file_path: console,checkov-results.sarif
        quiet: true

    - name: Filter in-source suppressed findings
      id: filter
      if: always() && (steps.templates.outputs.present == 'true' || steps.templates.outputs.present == 'false')
      shell: bash
      env:
        SARIF_INPUT: ${{ github.workspace }}/checkov-results.sarif
        SARIF_OUTPUT: ${{ github.workspace }}/checkov-results.filtered.sarif
        CHECKOV_PRESENT: ${{ steps.templates.outputs.present }}
      run: |
        if [ "$CHECKOV_PRESENT" = "true" ] && [ ! -e "$SARIF_INPUT" ]; then
          echo "checkov-cloudformation: no SARIF at $SARIF_INPUT" >&2
          echo "checkov-cloudformation: the scanner container only keeps files written in the workspace" >&2
          exit 1
        fi
        python3 "$GITHUB_ACTION_PATH/../lib/filter_sarif.py"

    - name: Upload SARIF results
      if: always() && inputs.upload == 'true' && steps.filter.outputs.filtered_sarif != ''
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      continue-on-error: true
      with:
        sarif_file: ${{ steps.filter.outputs.filtered_sarif }}
        wait-for-processing: false
