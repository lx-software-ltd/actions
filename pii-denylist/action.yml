name: PII denylist
description: >-
  Fail when tracked source matches the organisation SHA-256 denylist,
  plus any extra digests the caller supplies.
  A hit is a path and line number. The matched text is not printed.

inputs:
  denylist-path:
    description: >-
      Extra digests, added to the organisation list. Relative to root
      unless absolute. The default scripts/pii-denylist.sha256 is optional.
    required: false
    default: scripts/pii-denylist.sha256
  root:
    description: >-
      Directory to scan. Empty scans the calling workspace.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check hashed PII denylist
      shell: bash
      env:
        PII_DENYLIST: ${{ inputs.denylist-path }}
        PII_ROOT: ${{ inputs.root }}
      run: python3 "$GITHUB_ACTION_PATH/check_pii.py"
